<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Agent Ricochet — Play Demo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#10172c;color:#f2f7ff;font-family:system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:12px;overflow:hidden}.app{display:flex;flex-direction:column;align-items:center;gap:10px}header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:19px;margin:0;font-weight:750}button,a{border:1px solid #405779;border-radius:8px;background:#233758;color:white;padding:8px 12px;text-decoration:none;font:13px system-ui;cursor:pointer}nav{display:flex;gap:6px}.stage{position:relative;width:min(calc((100dvh - 90px)*0.5625),calc(100vw - 24px));aspect-ratio:9/16;background:#141838;box-shadow:0 12px 60px #0008;border-radius:9px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#141838;flex-direction:column;gap:16px;font-weight:600}progress{accent-color:#32cbcd;width:65%;height:12px}.error{position:absolute;inset:20px;display:none;padding:20px;background:#371a2b;color:#fff;white-space:pre-wrap}footer{font-size:12px;color:#9dacc5;max-width:520px;text-align:center}footer a{border:0;background:transparent;padding:0;color:#c8e6ff}
</style></head><body><main class="app"><header><h1>Agent Ricochet</h1><nav id="views"></nav><button id="fullscreen" type="button">Fullscreen</button></header><div class="stage"><canvas id="game" width="540" height="960" tabindex="0" aria-label="Agent Ricochet game"></canvas><div class="loading" id="loading"><span>Loading Agent Ricochet…</span><progress id="progress" value="0" max="1"></progress></div><div class="error" id="error" role="alert"></div></div><footer>Click or tap a bolt to move its matching nuts.</footer></main>
<script>
const canvas=document.getElementById('game');
const error=document.getElementById('error');
function showError(message){error.style.display='block';error.textContent=message;document.getElementById('loading').style.display='none';}
const config={dataUrl:'Build/WebGL.data.unityweb',frameworkUrl:'Build/WebGL.framework.js.unityweb',codeUrl:'Build/WebGL.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'SatisVizion',productName:'Agent Ricochet',productVersion:'1.0.0',devicePixelRatio:Math.min(window.devicePixelRatio||1,2),showBanner:(message,type)=>{if(type==='error')showError(message);else console.warn(message);}};
const script=document.createElement('script');script.src='Build/WebGL.loader.js';script.onerror=()=>showError('The game files could not be loaded. Please refresh the page or try another browser.');script.onload=()=>createUnityInstance(canvas,config,(value)=>document.getElementById('progress').value=value).then(instance=>{window.unityInstance=instance;document.getElementById('loading').style.display='none';document.getElementById('fullscreen').onclick=()=>instance.SetFullscreen(1);canvas.focus();}).catch(message=>showError(String(message)));document.body.appendChild(script);

</script></body></html>
